name: Android emülatör testi

on:
  workflow_dispatch:
  push:
    branches: [terlik-galaksisi]
    paths: ['scripts/emulator-testi.sh', '.github/workflows/android-emulator-testi.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: APK'yı indir
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download apk --repo "$GITHUB_REPOSITORY" --pattern TerlikGalaksisi.apk
      - name: KVM'yi etkinleştir
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/emulator-testi.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-sonuclari
          path: out/
          retention-days: 7
